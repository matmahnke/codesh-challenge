services:
  backend:
    build:
      context: ./OrderAccumulator
      dockerfile: Dockerfile
    container_name: order-accumulator
    ports:
      - "5165:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/orders.db"
    volumes:
      - orders-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./OrderGenerator
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5164
    container_name: order-generator
    ports:
      - "5174:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  orders-data:
